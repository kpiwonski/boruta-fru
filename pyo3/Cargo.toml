[package]
name = "pyboruta"
version = "0.1.0"
edition = "2024"


[lib]
name = "pyboruta"
crate-type = ["cdylib"]

[dependencies]
minarrow-pyo3 = {version="=0.16.2", features=["extended_numeric_types", "extended_categorical"]}
pyo3 = { version = "0.29", features = ["abi3-py38"] }
boruta-fru= {path="../boruta-fru"} 
minarrow = "0.16.2"
env_logger = "0.11.11"

[profile.release]
codegen-units = 1
lto = "fat"
